<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>msg</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📨</text></svg>">
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --fg:#1b1f24; --muted:#6b7280; --line:#e5e7eb;
  --accent:#2563eb; --new:#fef9c3; --chip:#eef1f5; --ok:#15803d; --bad:#b91c1c; --wait:#a16207; --hi:#dc2626;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1115; --card:#171a21; --fg:#e6e8eb; --muted:#9097a3; --line:#262a33;
         --accent:#60a5fa; --new:#3b3415; --chip:#232733; --ok:#4ade80; --bad:#f87171; --wait:#facc15; --hi:#f87171; }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
.bar{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0;white-space:nowrap}
nav{display:flex;gap:2px;background:var(--chip);border-radius:10px;padding:2px}
nav a{padding:4px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:14px}
nav a.on{background:var(--card);color:var(--fg)}
.filters{display:flex;gap:8px;flex:1;min-width:240px}
input,select,textarea{min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit}
input[type=search]{flex:1}
input[type=checkbox],input[type=radio]{width:auto;padding:0}
main{max-width:760px;margin:0 auto;padding:12px 16px 40px}
.status{color:var(--muted);font-size:13px;margin:4px 0 12px;display:flex;justify-content:space-between;gap:8px}
.card,.msg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.msg{transition:background 1.5s}
.msg.new{background:var(--new)}
.msg.high{border-left:4px solid var(--hi)}
.head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.title{font-weight:600;overflow-wrap:anywhere}
.time{color:var(--muted);font-size:12px;white-space:nowrap}
.body{margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.fields{margin:6px 0 0;font-size:13px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:0 10px}
.fields dt{white-space:nowrap}.fields dd{margin:0;overflow-wrap:anywhere;color:var(--fg)}
.foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.chip{background:var(--chip);border-radius:999px;padding:1px 8px;font-size:12px}
.chip.sent,.chip.active{color:var(--ok)}.chip.failed,.chip.error{color:var(--bad)}.chip.pending{color:var(--wait)}.chip.disabled{color:var(--muted)}
.grow{flex:1}
button.link{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:2px 4px}
button.link.danger{color:var(--bad)}
button.btn{padding:7px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:default}
a{color:var(--accent)}
button.more{display:block;margin:16px auto}
.empty{text-align:center;color:var(--muted);padding:40px 0}
#login{max-width:360px;margin:60px auto}
#login input{width:100%;margin:10px 0}
h2{font-size:16px;margin:22px 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.form{display:grid;gap:12px;margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
.form label{display:grid;gap:4px;font-size:14px}
.form label.inline{display:flex;gap:8px;align-items:center}
.help{color:var(--muted);font-size:12px}
.err{color:var(--bad);font-size:13px}
.ok{color:var(--ok);font-size:13px}
.chats{border:1px dashed var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.chats .row{justify-content:space-between;padding:3px 0}
.routes .row{gap:12px}
.secret{display:flex;gap:8px;align-items:center;margin:8px 0}
.secret code{flex:1;min-width:0;overflow-wrap:anywhere;background:var(--chip);border-radius:8px;padding:8px 10px;font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
.card.revoked{opacity:.55}
.card.highlight{border-color:var(--ok)}
</style>
</head>
<body>
<header><div class="bar">
  <h1>📨 msg</h1>
  <nav id="nav" hidden><a href="#" id="navMsgs" class="on">消息</a><a href="#settings" id="navSettings">设置</a></nav>
  <div class="filters" id="filters">
    <select id="kind" aria-label="类型"><option value="">全部类型</option></select>
    <input type="search" id="q" placeholder="搜索标题或内容" autocomplete="off">
  </div>
</div></header>
<main>
  <div id="login" class="card" hidden>
    <b>需要登录</b>
    <p class="sub" style="margin-top:6px">没有检测到 Cloudflare Access 登录，可以输入一个有 messages:read 权限的 token：</p>
    <input type="password" id="tok" placeholder="token" autocomplete="off">
    <button class="btn primary" id="tokBtn">进入</button>
  </div>

  <div id="app" hidden>
    <div class="status"><span id="who"></span><span id="live"></span></div>
    <div id="list"></div>
    <button class="btn more" id="more" hidden>加载更多</button>
  </div>

  <div id="settings" hidden>
    <h2>发送渠道</h2>
    <p class="sub">消息会转发到这些渠道。修改后立即生效。密钥保存后不会再显示。</p>
    <div id="senderList"></div>
    <div class="row"><button class="btn" id="addSender">+ 添加渠道</button></div>
    <div id="newSender"></div>

    <h2>路由</h2>
    <p class="sub">每种消息默认发给哪些渠道。提交消息时也可以用 <code>senders</code> 单独指定。</p>
    <div id="routes" class="routes"></div>

    <div id="tokensSection" hidden>
      <h2>API Token</h2>
      <p class="sub">给手机快捷指令、脚本等程序用，放在请求头 <code>Authorization: Bearer &lt;token&gt;</code> 里。
        token 只在生成时显示一次；不用了或可能泄露时，点“吊销”立即失效。</p>
      <div id="newTokenResult"></div>
      <div id="tokenList"></div>
      <div class="row"><button class="btn" id="addToken">+ 生成 token</button></div>
      <div id="newToken"></div>
      <label class="inline help" style="margin-top:8px"><input type="checkbox" id="showRevoked">显示已吊销的 token</label>
    </div>
  </div>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const API = '/api/v1';
  const PAGE = 50;
  const STATUS = { sent: '✓', pending: '…', failed: '✗' };
  const SENDER_STATUS = { active: '运行中', disabled: '已停用', error: '出错' };
  let token = null;
  try { token = localStorage.getItem('msg.token'); } catch {}
  let me = null, newestId = 0, oldestId = 0, timer = null;
  const filter = { kind: '', q: '' };

  async function api(path, opts = {}) {
    const headers = { ...(opts.body ? { 'Content-Type': 'application/json' } : {}), ...(token ? { Authorization: 'Bearer ' + token } : {}) };
    const r = await fetch(API + path, { ...opts, headers, credentials: 'same-origin' });
    if (r.status === 401) throw Object.assign(new Error('unauthorized'), { auth: true });
    if (r.status === 204) return null;
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(body.error?.message || 'HTTP ' + r.status), { field: body.error?.field, code: body.error?.code });
    return body;
  }
  const can = (scope) => me?.scopes?.includes(scope);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const btn = (text, cls, onclick) => Object.assign(el('button', cls || 'link', text), { type: 'button', onclick });
  const errText = (e) => (e.field ? e.field + '：' : '') + e.message;

  // ---------- messages ----------
  const fmt = new Intl.DateTimeFormat(undefined, { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  function ago(t) {
    const s = Math.round((Date.now() - t) / 1000);
    if (s < 60) return Math.max(s, 0) + ' 秒前';
    if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
    return Math.floor(s / 86400) + ' 天前';
  }

  function render(m, fresh) {
    const e = m.envelope, t = Date.parse(e.time);
    const card = el('div', 'msg' + (fresh ? ' new' : '') + (e.priority === 'high' ? ' high' : ''));
    card.dataset.ts = t;
    const head = el('div', 'head');
    head.append(el('span', 'title', e.title || '(无标题)'), Object.assign(el('span', 'time', ago(t)), { title: fmt.format(t) }));
    card.append(head);
    if (e.body) card.append(el('div', 'body', e.body));
    if (e.fields?.length) {
      const dl = el('dl', 'fields');
      for (const f of e.fields) dl.append(el('dt', '', f.name), el('dd', '', f.value));
      card.append(dl);
    }
    if (e.link && /^https?:\/\//.test(e.link)) {
      const a = el('a', '', '详情'); a.href = e.link; a.target = '_blank'; a.rel = 'noopener noreferrer';
      card.append(a);
    }
    const foot = el('div', 'foot');
    foot.append(el('span', 'chip', m.kind), el('span', '', m.source), el('span', '', fmt.format(t) + ' · #' + m.id));
    for (const [snd, st] of Object.entries(m.deliveries || {})) foot.append(Object.assign(el('span', 'chip ' + st, snd + ' ' + (STATUS[st] || st)), { title: st }));
    foot.append(el('span', 'grow'));
    if (can('deliveries:write') && Object.values(m.deliveries || {}).includes('failed')) {
      const b = btn('重发', 'link', async () => {
        try { await api(`/messages/${m.id}/deliveries`, { method: 'POST', body: '{}' }); b.textContent = '已排队'; b.disabled = true; } catch (err) { alert(err.message); }
      });
      foot.append(b);
    }
    if (can('messages:delete')) {
      foot.append(btn('删除', 'link danger', async () => {
        if (!confirm('删除这条消息？')) return;
        try { await api(`/messages/${m.id}`, { method: 'DELETE' }); card.remove(); } catch (err) { alert(err.message); }
      }));
    }
    card.append(foot);
    if (fresh) setTimeout(() => card.classList.remove('new'), 3000);
    return card;
  }

  function query(extra) {
    const p = new URLSearchParams({ limit: PAGE, ...extra });
    if (filter.kind) p.set('kind', filter.kind);
    if (filter.q) p.set('q', filter.q);
    return '/messages?' + p;
  }
  async function load() {
    const { items, next_before } = await api(query({}));
    const list = $('list'); list.replaceChildren();
    if (!items.length) list.append(el('div', 'empty', '没有消息'));
    items.forEach(m => list.append(render(m)));
    newestId = items.length ? items[0].id : 0;
    oldestId = next_before || 0;
    $('more').hidden = !next_before;
  }
  async function loadMore() {
    const { items, next_before } = await api(query({ before: oldestId }));
    items.forEach(m => $('list').append(render(m)));
    oldestId = next_before || 0;
    $('more').hidden = !next_before;
  }
  async function poll() {
    if (location.hash === '#settings') return;
    try {
      const { items } = await api(query(newestId ? { since: newestId } : {}));
      const fresh = items.filter(m => m.id > newestId);
      if (fresh.length) {
        $('list').querySelector('.empty')?.remove();
        for (const m of fresh.slice().reverse()) $('list').prepend(render(m, true));
        newestId = fresh[0].id;
        if (document.hidden) document.title = '(' + fresh.length + ') msg';
      }
      $('live').textContent = '● 实时';
    } catch { $('live').textContent = '○ 连接中断'; }
    document.querySelectorAll('.msg').forEach(c => c.querySelector('.time').textContent = ago(+c.dataset.ts));
  }

  // ---------- settings ----------
  let types = [], senderItems = [];

  async function loadSettings() {
    const [t, s] = await Promise.all([api('/sender-types'), api('/senders')]);
    types = t.items; senderItems = s.items;
    renderSenders();
    await loadRoutes();
  }

  function renderSenders() {
    const box = $('senderList'); box.replaceChildren();
    if (!senderItems.length) box.append(el('div', 'empty', '还没有渠道，点下面添加一个。'));
    for (const s of senderItems) box.append(senderCard(s));
  }

  function typeOf(name) { return types.find(t => t.name === name); }

  function senderCard(s) {
    const t = typeOf(s.type);
    const card = el('div', 'card');
    const head = el('div', 'row');
    head.append(el('b', '', s.name), el('span', 'chip', t?.label || s.type), el('span', 'chip ' + s.status, SENDER_STATUS[s.status] || s.status), el('span', 'grow'));
    const result = el('span', '');
    head.append(
      btn('测试', 'link', async () => {
        result.className = ''; result.textContent = '发送中…';
        try {
          const r = await api(`/senders/${encodeURIComponent(s.name)}/test`, { method: 'POST' });
          result.className = r.ok ? 'ok' : 'err'; result.textContent = r.ok ? '已发送，请查收' : '失败：' + r.error;
        } catch (e) { result.className = 'err'; result.textContent = errText(e); }
      }),
      btn(s.enabled ? '停用' : '启用', 'link', () => saveSender(s.name, { enabled: !s.enabled })),
      btn('编辑', 'link', () => { form.hidden = !form.hidden; }),
      btn('删除', 'link danger', async () => {
        if (!confirm(`删除渠道 ${s.name}？路由里引用它的地方也会一并去掉。`)) return;
        try { await api(`/senders/${encodeURIComponent(s.name)}`, { method: 'DELETE' }); await loadSettings(); } catch (e) { alert(errText(e)); }
      }),
    );
    card.append(head);
    if (s.status === 'error' && s.error) card.append(el('div', 'err', s.error));
    card.append(result);
    const form = senderForm(t, s);
    form.hidden = !(s.status === 'active' && s.can_list_chats && !(s.config?.chat_ids || []).length);
    card.append(form);
    return card;
  }

  // senderForm renders the type's fields. existing = null for a new sender.
  function senderForm(t, existing) {
    const form = el('div', 'form');
    const inputs = {};
    let typeSel, nameInput, enabledBox;

    if (!existing) {
      typeSel = el('select');
      for (const ty of types) typeSel.append(Object.assign(el('option', '', ty.label), { value: ty.name }));
      typeSel.value = t.name;
      typeSel.onchange = () => { const f = senderForm(typeOf(typeSel.value), null); f.className = form.className; form.replaceWith(f); };
      const l1 = el('label', '', '类型'); l1.append(typeSel, el('span', 'help', t.description));
      nameInput = Object.assign(el('input'), { placeholder: '例如 tg、discord-home', autocomplete: 'off' });
      const l2 = el('label', '', '名称'); l2.append(nameInput, el('span', 'help', '小写字母、数字、- 或 _，之后不能修改；路由和 API 里用这个名字。'));
      form.append(l1, l2);
    } else if (t?.description) {
      form.append(el('div', 'help', t.description));
    }

    for (const f of t?.fields || []) {
      const cur = existing?.config?.[f.name];
      let input;
      if (f.kind === 'bool') {
        input = Object.assign(el('input'), { type: 'checkbox', checked: !!cur });
        const l = el('label', 'inline'); l.append(input, el('span', '', f.label));
        form.append(l);
        if (f.help) form.append(el('div', 'help', f.help));
      } else {
        input = el('input');
        if (f.kind === 'secret') {
          input.type = 'password'; input.autocomplete = 'off';
          input.placeholder = existing?.secrets_set?.includes(f.name) ? '已设置；留空则不修改' : (f.required ? '必填' : '');
        } else if (f.kind === 'int_list') {
          input.value = (cur || []).join(', '); input.placeholder = '多个用逗号分隔';
        } else {
          input.value = cur || '';
        }
        const l = el('label', '', f.label + (f.required ? ' *' : '')); l.append(input);
        if (f.help) l.append(el('span', 'help', f.help));
        form.append(l);
      }
      inputs[f.name] = { f, input };
    }

    enabledBox = Object.assign(el('input'), { type: 'checkbox', checked: existing ? existing.enabled : true });
    const le = el('label', 'inline'); le.append(enabledBox, el('span', '', '启用'));
    form.append(le);

    // Telegram-style helper: pick chat ids from chats that recently messaged the bot.
    const listField = Object.values(inputs).find(x => x.f.kind === 'int_list');
    if (existing && existing.can_list_chats && listField) {
      const box = el('div', 'chats');
      const list = el('div');
      const refresh = async () => {
        list.replaceChildren(el('div', 'help', '加载中…'));
        try {
          const { items } = await api(`/senders/${encodeURIComponent(existing.name)}/chats`);
          list.replaceChildren();
          if (!items.length) list.append(el('div', 'help', '还没有会话。先在 Telegram 里给这个 bot 发一句话，然后点“刷新”。'));
          for (const c of items) {
            const row = el('div', 'row');
            row.append(el('span', '', `${c.title || '(无名)'} · ${c.type} · ${c.id}`));
            row.append(btn('加入', 'link', () => {
              const ids = listField.input.value.split(/[,\s]+/).filter(Boolean);
              if (!ids.includes(String(c.id))) ids.push(String(c.id));
              listField.input.value = ids.join(', ');
            }));
            list.append(row);
          }
        } catch (e) { list.replaceChildren(el('div', 'err', errText(e))); }
      };
      const head = el('div', 'row'); head.append(el('b', '', '最近的会话'), el('span', 'grow'), btn('刷新', 'link', refresh));
      box.append(head, list);
      form.append(box);
      refresh();
    } else if (!existing && t?.name === 'telegram') {
      form.append(el('div', 'help', '保存后，给 bot 发一句话，再点“编辑”从“最近的会话”里添加 Chat ID。'));
    }

    const msg = el('div', '');
    const save = btn('保存', 'btn primary', async () => {
      const config = {};
      for (const [name, { f, input }] of Object.entries(inputs)) {
        if (f.kind === 'bool') config[name] = input.checked;
        else if (f.kind === 'int_list') config[name] = input.value;
        else if (f.kind === 'secret') { if (input.value.trim()) config[name] = input.value.trim(); }
        else config[name] = input.value;
      }
      msg.className = ''; msg.textContent = '保存中…'; save.disabled = true;
      try {
        if (existing) await api(`/senders/${encodeURIComponent(existing.name)}`, { method: 'PATCH', body: JSON.stringify({ enabled: enabledBox.checked, config }) });
        else await api('/senders', { method: 'POST', body: JSON.stringify({ name: nameInput.value.trim(), type: typeSel.value, enabled: enabledBox.checked, config }) });
        $('newSender').replaceChildren();
        await loadSettings();
      } catch (e) { msg.className = 'err'; msg.textContent = errText(e); save.disabled = false; }
    });
    const actions = el('div', 'row'); actions.append(save);
    if (!existing) actions.append(btn('取消', 'btn', () => $('newSender').replaceChildren()));
    form.append(actions, msg);
    return form;
  }

  async function saveSender(name, change) {
    try { await api(`/senders/${encodeURIComponent(name)}`, { method: 'PATCH', body: JSON.stringify(change) }); await loadSettings(); }
    catch (e) { alert(errText(e)); }
  }

  async function loadRoutes() {
    const { items } = await api('/routes');
    const box = $('routes'); box.replaceChildren();
    for (const r of items) {
      const card = el('div', 'card');
      const head = el('div', 'row'); head.append(el('b', '', r.kind), el('span', 'grow'),
        el('span', 'help', '当前发往：' + (r.effective.length ? r.effective.join(', ') : '（不推送）')));
      card.append(head);
      const name = 'route-' + r.kind;
      const all = Object.assign(el('input'), { type: 'radio', name, checked: !r.custom });
      const pick = Object.assign(el('input'), { type: 'radio', name, checked: r.custom });
      const la = el('label', 'inline'); la.append(all, el('span', '', '所有启用的渠道（默认）'));
      const lp = el('label', 'inline'); lp.append(pick, el('span', '', '只发给：'));
      const boxes = el('div', 'row');
      const checks = senderItems.map(s => {
        const c = Object.assign(el('input'), { type: 'checkbox', checked: (r.senders || []).includes(s.name) });
        const l = el('label', 'inline'); l.append(c, el('span', '', s.name + (s.status === 'active' ? '' : '（' + (SENDER_STATUS[s.status] || s.status) + '）')));
        boxes.append(l);
        c.onchange = () => { pick.checked = true; };
        return [s.name, c];
      });
      const msg = el('span', '');
      const save = btn('保存', 'btn', async () => {
        const body = all.checked ? { senders: null } : { senders: checks.filter(([, c]) => c.checked).map(([n]) => n) };
        try { await api('/routes/' + encodeURIComponent(r.kind), { method: 'PUT', body: JSON.stringify(body) }); await loadRoutes(); }
        catch (e) { msg.className = 'err'; msg.textContent = errText(e); }
      });
      const form = el('div', 'form'); form.append(la, lp, boxes, el('div', 'row'));
      form.lastChild.append(save, msg);
      card.append(form);
      box.append(card);
    }
  }

  // ---------- API tokens ----------
  const SCOPE_LABEL = {
    'messages:write': '提交消息', 'messages:read': '读取消息',
    'messages:delete': '删除消息', 'deliveries:write': '重新投递',
  };
  const dfmt = new Intl.DateTimeFormat(undefined, { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
  let tokenMeta = { mintable_scopes: [], kinds: [] };

  async function loadTokens() {
    const r = await api('/tokens' + ($('showRevoked').checked ? '?include_revoked=1' : ''));
    tokenMeta = r;
    const box = $('tokenList'); box.replaceChildren();
    if (!r.items.length) box.append(el('div', 'empty', '还没有 token。'));
    for (const t of r.items) box.append(tokenCard(t));
  }

  function tokenCard(t) {
    const card = el('div', 'card' + (t.revoked_at ? ' revoked' : ''));
    const head = el('div', 'row');
    head.append(el('b', '', t.name));
    if (t.prefix) head.append(el('code', 'chip', t.prefix + '…'));
    head.append(el('span', 'chip ' + (t.revoked_at ? 'disabled' : 'active'), t.revoked_at ? '已吊销' : (t.origin === 'config' ? '配置文件' : '有效')));
    head.append(el('span', 'grow'));
    if (t.origin === 'web' && !t.revoked_at) {
      head.append(btn('吊销', 'link danger', async () => {
        if (!confirm(`吊销 token「${t.name}」？使用它的程序会立即无法访问。`)) return;
        try { await api('/tokens/' + t.id, { method: 'DELETE' }); await loadTokens(); } catch (e) { alert(errText(e)); }
      }));
    }
    card.append(head);
    const meta = el('div', 'foot');
    meta.append(el('span', '', '权限：' + t.scopes.map(s => SCOPE_LABEL[s] || s).join('、')));
    meta.append(el('span', '', '类型：' + (t.kinds ? t.kinds.join('、') : '全部')));
    if (t.created_at) meta.append(el('span', '', '创建：' + dfmt.format(Date.parse(t.created_at)) + (t.created_by ? '（' + t.created_by + '）' : '')));
    meta.append(el('span', '', '最近使用：' + (t.last_used_at ? ago(Date.parse(t.last_used_at)) : (t.origin === 'config' ? '—' : '从未'))));
    if (t.revoked_at) meta.append(el('span', '', '吊销：' + dfmt.format(Date.parse(t.revoked_at))));
    if (t.origin === 'config') meta.append(el('span', '', '写在服务器配置文件里，只能在那里删除'));
    card.append(meta);
    return card;
  }

  function tokenForm() {
    const form = el('div', 'form card');
    const name = Object.assign(el('input'), { placeholder: '例如 iphone-backup、gpu-server', autocomplete: 'off' });
    const ln = el('label', '', '名称'); ln.append(name, el('span', 'help', '会作为消息的“来源”显示。小写字母、数字、. - _。'));
    form.append(ln);

    form.append(el('div', '', '权限'));
    const scopeBoxes = tokenMeta.mintable_scopes.map(s => {
      const c = Object.assign(el('input'), { type: 'checkbox', checked: s === 'messages:write' });
      const l = el('label', 'inline'); l.append(c, el('span', '', (SCOPE_LABEL[s] || s) + '（' + s + '）'));
      form.append(l);
      return [s, c];
    });
    form.append(el('div', 'help', '管理渠道和 token 只能在登录后的网页上进行，不能授予 token。'));

    form.append(el('div', '', '可用的消息类型'));
    const allKinds = Object.assign(el('input'), { type: 'radio', name: 'tokkinds', checked: true });
    const someKinds = Object.assign(el('input'), { type: 'radio', name: 'tokkinds' });
    const la = el('label', 'inline'); la.append(allKinds, el('span', '', '全部类型'));
    const ls = el('label', 'inline'); ls.append(someKinds, el('span', '', '只限：'));
    const kindRow = el('div', 'row');
    const kindBoxes = tokenMeta.kinds.map(k => {
      const c = Object.assign(el('input'), { type: 'checkbox' });
      c.onchange = () => { someKinds.checked = true; };
      const l = el('label', 'inline'); l.append(c, el('span', '', k)); kindRow.append(l);
      return [k, c];
    });
    form.append(la, ls, kindRow);

    const msg = el('div', '');
    const save = btn('生成', 'btn primary', async () => {
      const body = {
        name: name.value.trim(),
        scopes: scopeBoxes.filter(([, c]) => c.checked).map(([s]) => s),
        kinds: allKinds.checked ? null : kindBoxes.filter(([, c]) => c.checked).map(([k]) => k),
      };
      save.disabled = true; msg.className = ''; msg.textContent = '生成中…';
      try {
        const r = await api('/tokens', { method: 'POST', body: JSON.stringify(body) });
        $('newToken').replaceChildren();
        showSecret(r);
        await loadTokens();
      } catch (e) { msg.className = 'err'; msg.textContent = errText(e); save.disabled = false; }
    });
    const actions = el('div', 'row'); actions.append(save, btn('取消', 'btn', () => $('newToken').replaceChildren()));
    form.append(actions, msg);
    return form;
  }

  function showSecret(r) {
    const card = el('div', 'card highlight');
    card.append(el('b', '', `token「${r.info.name}」已生成`));
    card.append(el('div', 'err', '请现在复制保存。关闭后无法再次查看，只能吊销后重新生成。'));
    const row = el('div', 'secret');
    const code = el('code', '', r.token);
    const copy = btn('复制', 'btn', async () => {
      try { await navigator.clipboard.writeText(r.token); copy.textContent = '已复制 ✓'; } catch { copy.textContent = '请手动复制'; }
    });
    row.append(code, copy);
    card.append(row, el('div', 'help', '请求头：Authorization: Bearer ' + r.token.slice(0, 10) + '…'));
    card.append(btn('我已保存，关闭', 'btn', () => card.remove()));
    $('newTokenResult').replaceChildren(card);
  }

  $('addToken').onclick = () => $('newToken').replaceChildren(tokenForm());
  $('showRevoked').onchange = () => loadTokens().catch(e => alert(errText(e)));

  $('addSender').onclick = () => {
    if (!types.length) return;
    $('newSender').replaceChildren(Object.assign(senderForm(types.find(t => t.name === 'telegram') || types[0], null), { className: 'form card' }));
  };

  // ---------- views ----------
  async function show() {
    const settings = location.hash === '#settings' && (can('senders:write') || can('tokens:write'));
    $('app').hidden = settings; $('settings').hidden = !settings; $('filters').hidden = settings;
    $('navMsgs').classList.toggle('on', !settings); $('navSettings').classList.toggle('on', settings);
    if (settings) {
      $('tokensSection').hidden = !can('tokens:write');
      if (can('senders:write')) { try { await loadSettings(); } catch (e) { $('senderList').replaceChildren(el('div', 'err', errText(e))); } }
      if (can('tokens:write')) { try { await loadTokens(); } catch (e) { $('tokenList').replaceChildren(el('div', 'err', errText(e))); } }
    }
  }

  async function start() {
    try {
      me = await api('/me');
      $('who').textContent = (me.via === 'token' ? 'token: ' : '') + me.name;
      const { items } = await api('/kinds');
      const sel = $('kind'); sel.length = 1;
      for (const k of items) sel.append(Object.assign(el('option', '', k.name + ' · ' + k.description), { value: k.name }));
      $('login').hidden = true;
      $('nav').hidden = !(can('senders:write') || can('tokens:write'));
      await load();
      clearInterval(timer); timer = setInterval(poll, 5000);
      await show();
    } catch (e) {
      if (e.auth) {
        if (token) { token = null; try { localStorage.removeItem('msg.token'); } catch {} }
        $('app').hidden = true; $('settings').hidden = true; $('login').hidden = false;
      } else {
        $('app').hidden = false; $('list').replaceChildren(el('div', 'empty', '加载失败：' + e.message));
      }
    }
  }

  window.addEventListener('hashchange', show);
  let debounce;
  $('q').oninput = () => { clearTimeout(debounce); debounce = setTimeout(() => { filter.q = $('q').value.trim(); load(); }, 250); };
  $('kind').onchange = () => { filter.kind = $('kind').value; load(); };
  $('more').onclick = loadMore;
  $('tokBtn').onclick = () => { token = $('tok').value.trim(); try { localStorage.setItem('msg.token', token); } catch {} start(); };
  $('tok').onkeydown = (e) => { if (e.key === 'Enter') $('tokBtn').click(); };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) document.title = 'msg'; });
  start();
})();
</script>
</body>
</html>
