<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>msg</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📨</text></svg>">
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --fg:#1b1f24; --muted:#6b7280; --line:#e5e7eb;
  --accent:#2563eb; --new:#fef9c3; --chip:#eef1f5; --ok:#15803d; --bad:#b91c1c; --wait:#a16207; --hi:#dc2626;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1115; --card:#171a21; --fg:#e6e8eb; --muted:#9097a3; --line:#262a33;
         --accent:#60a5fa; --new:#3b3415; --chip:#232733; --ok:#4ade80; --bad:#f87171; --wait:#facc15; --hi:#f87171; }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
.bar{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center}
h1{font-size:17px;margin:0;white-space:nowrap}
input[type=search],select{min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit}
input[type=search]{flex:1}
main{max-width:760px;margin:0 auto;padding:12px 16px 40px}
.status{color:var(--muted);font-size:13px;margin:4px 0 12px;display:flex;justify-content:space-between;gap:8px}
.msg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;transition:background 1.5s}
.msg.new{background:var(--new)}
.msg.high{border-left:4px solid var(--hi)}
.head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.title{font-weight:600;overflow-wrap:anywhere}
.time{color:var(--muted);font-size:12px;white-space:nowrap}
.body{margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.fields{margin:6px 0 0;font-size:13px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:0 10px}
.fields dt{white-space:nowrap}.fields dd{margin:0;overflow-wrap:anywhere;color:var(--fg)}
.foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.chip{background:var(--chip);border-radius:999px;padding:1px 8px}
.chip.sent{color:var(--ok)}.chip.failed{color:var(--bad)}.chip.pending{color:var(--wait)}
.foot .grow{flex:1}
.foot button{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:2px 4px}
.foot button.danger{color:var(--bad)}
a{color:var(--accent)}
button.more{display:block;margin:16px auto;padding:8px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:40px 0}
#login{max-width:360px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
#login input{width:100%;padding:8px 12px;margin:10px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit}
#login button{padding:8px 16px;border-radius:10px;border:0;background:var(--accent);color:#fff;font:inherit;cursor:pointer}
</style>
</head>
<body>
<header><div class="bar">
  <h1>📨 msg</h1>
  <select id="kind" aria-label="类型"><option value="">全部类型</option></select>
  <input type="search" id="q" placeholder="搜索标题或内容" autocomplete="off">
</div></header>
<main>
  <div id="login" hidden>
    <b>需要登录</b>
    <p style="color:var(--muted);font-size:13px;margin:6px 0">没有检测到 Cloudflare Access 登录，可以输入一个有 messages:read 权限的 token：</p>
    <input type="password" id="tok" placeholder="token" autocomplete="off">
    <button id="tokBtn">进入</button>
  </div>
  <div id="app" hidden>
    <div class="status"><span id="who"></span><span id="live"></span></div>
    <div id="list"></div>
    <button class="more" id="more" hidden>加载更多</button>
  </div>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const API = '/api/v1';
  const PAGE = 50;
  const STATUS = { sent: '✓', pending: '…', failed: '✗' };
  let token = null;
  try { token = localStorage.getItem('msg.token'); } catch {}
  let me = null, newestId = 0, oldestId = 0, timer = null;
  const filter = { kind: '', q: '' };

  async function api(path, opts = {}) {
    const headers = { ...(opts.body ? { 'Content-Type': 'application/json' } : {}), ...(token ? { Authorization: 'Bearer ' + token } : {}) };
    const r = await fetch(API + path, { ...opts, headers, credentials: 'same-origin' });
    if (r.status === 401) throw Object.assign(new Error('unauthorized'), { auth: true });
    if (r.status === 204) return null;
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.error?.message || 'HTTP ' + r.status);
    return body;
  }
  const can = (scope) => me?.scopes?.includes(scope);

  const fmt = new Intl.DateTimeFormat(undefined, { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  function ago(t) {
    const s = Math.round((Date.now() - t) / 1000);
    if (s < 60) return Math.max(s, 0) + ' 秒前';
    if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
    return Math.floor(s / 86400) + ' 天前';
  }
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  function render(m, fresh) {
    const e = m.envelope, t = Date.parse(e.time);
    const card = el('div', 'msg' + (fresh ? ' new' : '') + (e.priority === 'high' ? ' high' : ''));
    card.dataset.id = m.id; card.dataset.ts = t;

    const head = el('div', 'head');
    head.append(el('span', 'title', e.title || '(无标题)'), Object.assign(el('span', 'time', ago(t)), { title: fmt.format(t) }));
    card.append(head);
    if (e.body) card.append(el('div', 'body', e.body));
    if (e.fields?.length) {
      const dl = el('dl', 'fields');
      for (const f of e.fields) dl.append(el('dt', '', f.name), el('dd', '', f.value));
      card.append(dl);
    }
    if (e.link && /^https?:\/\//.test(e.link)) {
      const a = el('a', '', '详情'); a.href = e.link; a.target = '_blank'; a.rel = 'noopener noreferrer';
      card.append(a);
    }

    const foot = el('div', 'foot');
    foot.append(el('span', 'chip', m.kind), el('span', '', m.source), el('span', '', fmt.format(t) + ' · #' + m.id));
    for (const [snd, st] of Object.entries(m.deliveries || {})) {
      foot.append(Object.assign(el('span', 'chip ' + st, snd + ' ' + (STATUS[st] || st)), { title: st }));
    }
    foot.append(el('span', 'grow'));
    if (can('deliveries:write') && Object.values(m.deliveries || {}).includes('failed')) {
      const b = el('button', '', '重发');
      b.onclick = async () => { try { await api(`/messages/${m.id}/deliveries`, { method: 'POST', body: '{}' }); b.textContent = '已排队'; b.disabled = true; } catch (err) { alert(err.message); } };
      foot.append(b);
    }
    if (can('messages:delete')) {
      const b = el('button', 'danger', '删除');
      b.onclick = async () => {
        if (!confirm('删除这条消息？')) return;
        try { await api(`/messages/${m.id}`, { method: 'DELETE' }); card.remove(); } catch (err) { alert(err.message); }
      };
      foot.append(b);
    }
    card.append(foot);
    if (fresh) setTimeout(() => card.classList.remove('new'), 3000);
    return card;
  }

  function query(extra) {
    const p = new URLSearchParams({ limit: PAGE, ...extra });
    if (filter.kind) p.set('kind', filter.kind);
    if (filter.q) p.set('q', filter.q);
    return '/messages?' + p;
  }

  async function load() {
    const { items, next_before } = await api(query({}));
    const list = $('list'); list.replaceChildren();
    if (!items.length) list.append(el('div', 'empty', '没有消息'));
    items.forEach(m => list.append(render(m)));
    newestId = items.length ? items[0].id : 0;
    oldestId = next_before || 0;
    $('more').hidden = !next_before;
  }

  async function loadMore() {
    const { items, next_before } = await api(query({ before: oldestId }));
    items.forEach(m => $('list').append(render(m)));
    oldestId = next_before || 0;
    $('more').hidden = !next_before;
  }

  async function poll() {
    try {
      const { items } = await api(query(newestId ? { since: newestId } : {}));
      const fresh = items.filter(m => m.id > newestId);
      if (fresh.length) {
        $('list').querySelector('.empty')?.remove();
        for (const m of fresh.slice().reverse()) $('list').prepend(render(m, true));
        newestId = fresh[0].id;
        if (document.hidden) document.title = '(' + fresh.length + ') msg';
      }
      $('live').textContent = '● 实时';
    } catch {
      $('live').textContent = '○ 连接中断';
    }
    document.querySelectorAll('.msg').forEach(c => c.querySelector('.time').textContent = ago(+c.dataset.ts));
  }

  async function start() {
    try {
      me = await api('/me');
      $('who').textContent = (me.via === 'token' ? 'token: ' : '') + me.name;
      const { items } = await api('/kinds');
      const sel = $('kind');
      sel.length = 1;
      for (const k of items) sel.append(Object.assign(el('option', '', k.name + ' · ' + k.description), { value: k.name }));
      $('login').hidden = true; $('app').hidden = false;
      await load();
      clearInterval(timer); timer = setInterval(poll, 5000);
    } catch (e) {
      if (e.auth) {
        if (token) { token = null; try { localStorage.removeItem('msg.token'); } catch {} }
        $('app').hidden = true; $('login').hidden = false;
      } else {
        $('app').hidden = false; $('list').replaceChildren(el('div', 'empty', '加载失败：' + e.message));
      }
    }
  }

  let debounce;
  $('q').oninput = () => { clearTimeout(debounce); debounce = setTimeout(() => { filter.q = $('q').value.trim(); load(); }, 250); };
  $('kind').onchange = () => { filter.kind = $('kind').value; load(); };
  $('more').onclick = loadMore;
  $('tokBtn').onclick = () => {
    token = $('tok').value.trim();
    try { localStorage.setItem('msg.token', token); } catch {}
    start();
  };
  $('tok').onkeydown = (e) => { if (e.key === 'Enter') $('tokBtn').click(); };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) document.title = 'msg'; });
  start();
})();
</script>
</body>
</html>
