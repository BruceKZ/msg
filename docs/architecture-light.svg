<line x1="24" y1="372" x2="976" y2="372" stroke="#d2d2d7" stroke-width="1"/>
<text x="24" y="402" font-size="13" fill="#1d1d1f"><tspan font-weight="600">Kind</tspan><tspan fill="#6e6e73">：每种消息一个，校验自己的字段并拼装成 Envelope。</tspan></text>
<text x="24" y="426" font-size="13" fill="#1d1d1f"><tspan font-weight="600">Sender</tspan><tspan fill="#6e6e73">：每个渠道一个，只认识 Envelope。核心只存储和投递 Envelope，新增类型或渠道都不用改它。</tspan></text>
</g></svg>
